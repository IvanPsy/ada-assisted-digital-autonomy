name: Ready-to-wear check

# Fails when the ready-to-wear translations fall behind core/core-behavior.md,
# when a generated file was edited by hand, or when a block no longer fits its box.

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check ready-to-wear versions
        run: python3 tools/ready_to_wear.py check
